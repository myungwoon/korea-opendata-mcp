[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korea-opendata-mcp"
version = "0.1.0"
description = "공공데이터포털(data.go.kr)·한국은행 ECOS·서울 열린데이터광장 MCP 서버 — 날씨, 미세먼지, 공휴일, 관광, 환율·금리, 지하철"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "data.go.kr", "공공데이터", "ecos", "seoul", "korea", "weather"]
dependencies = [
    "fastmcp>=2.12,<5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
korea-opendata-mcp = "kr_opendata.app:main"

[tool.hatch.build.targets.wheel]
packages = ["kr_opendata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
